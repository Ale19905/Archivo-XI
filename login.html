<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de sesión de Archivo XI para clientes de la tienda de camisetas de fútbol retro.">
  <meta name="keywords" content="Archivo XI, iniciar sesión, cuenta cliente, camisetas retro">
  <meta name="author" content="Archivo XI">
  <title>Iniciar sesión | Archivo XI</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Archivo XI, inicio"><span class="brand-mark">XI</span>ARCHIVO XI</a>
      <nav class="main-nav" aria-label="Navegación principal">
        <a href="index.html">Inicio</a><a href="nosotros.html">Nosotros</a><a href="productos.html">Camisetas</a><a href="contacto.html">Contacto</a><a class="nav-login" href="login.html" aria-current="page">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <main class="container login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">Tu cuenta</p>
      <h1 id="login-title">Iniciar sesión</h1>
      <p class="lead">Accede a tus favoritos, pedidos y preferencias de colección.</p>
      <form class="login-form" action="#" method="post">
        <div class="form-field">
          <label for="login-email">Correo electrónico</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required placeholder="nombre@correo.com">
        </div>
        <div class="form-field">
          <label for="login-password">Contraseña</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Tu contraseña">
        </div>
        <div class="login-options">
          <label class="check-row" for="recordarme"><input id="recordarme" name="recordarme" type="checkbox"><span>Recordarme</span></label>
          <a class="text-link" href="#">¿Olvidaste tu contraseña?</a>
        </div>
        <button class="btn" type="submit">Ingresar</button>
      </form>
      <p class="small-text">¿No tienes cuenta? <a class="text-link" href="#">Regístrate</a>.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner"><p>© 2026 Archivo XI.</p><div class="footer-links"><a href="nosotros.html">Nosotros</a><a href="productos.html">Camisetas</a><a href="contacto.html">Contacto</a></div></div>
  </footer>
</body>
</html>
